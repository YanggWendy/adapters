name: Adapter Review Runtime Diagnostic

on:
  pull_request:
    paths: [.github/workflows/adapter-review-runtime-diagnostic.yml]

permissions:
  contents: read

jobs:
  key-status:
    if: github.head_ref == 'diagnose/adapter-review-runtime-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read API-key status without exposing credentials
        shell: python
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ["ANTHROPIC_BASE_URL"].rstrip("/")
          key = os.environ["ANTHROPIC_API_KEY"]
          headers = {"Authorization": "Bearer " + key}
          for label, path in [("key-status", "/api/usage/token/"),
                              ("key-log", "/api/log/token?p=0&size=10")]:
              request = urllib.request.Request(base + path, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
                      data = payload.get("data", {})
                      if label == "key-status":
                          if not isinstance(data, dict):
                              data = {}
                          expiry = data.get("expires_at")
                          result = {"success": payload.get("success"), "message": payload.get("message"),
                                    "name": data.get("name"), "object": data.get("object"),
                                    "model_limits_enabled": data.get("model_limits_enabled"),
                                    "model_limits": data.get("model_limits"),
                                    "unlimited_quota": data.get("unlimited_quota"),
                                    "has_token_quota": data.get("total_available", 0) > 0,
                                    "expired": bool(expiry and expiry > 0 and expiry < time.time())}
                      else:
                          entries = data if isinstance(data, list) else data.get("items", data.get("logs", []))
                          fields = ("created_at", "model_name", "type", "group", "channel", "use_time")
                          result = {"success": payload.get("success"), "message": payload.get("message"),
                                    "entries": [{f: entry.get(f) for f in fields if f in entry} for entry in entries[:10]]}
                      output = json.dumps({"probe": label, "status": response.status, "result": result})
              except urllib.error.HTTPError as error:
                  output = json.dumps({"probe": label, "status": error.code,
                                       "error": error.read().decode(errors="replace")[:4000]})
              except Exception as error:
                  output = json.dumps({"probe": label, "error_type": type(error).__name__, "error": str(error)})
              for value in (key, base):
                  if value:
                      output = output.replace(value, "[REDACTED]")
              print(output)
