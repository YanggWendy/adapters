name: Adapter Review Runtime Diagnostic

on:
  pull_request:
    paths: [.github/workflows/adapter-review-runtime-diagnostic.yml]

permissions:
  contents: read

jobs:
  gateway-routing:
    if: github.head_ref == 'diagnose/adapter-review-runtime-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check model inventory and the original model
        shell: python
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ["ANTHROPIC_BASE_URL"].rstrip("/")
          key = os.environ["ANTHROPIC_API_KEY"]
          normalized = base[:-3] if base.endswith("/v1") else base
          print(json.dumps({"base_has_v1_suffix": base.endswith("/v1"),
                            "key_present": bool(key)}))

          def probe(label, url, headers, body=None):
              data = json.dumps(body).encode() if body else None
              request = urllib.request.Request(url, data=data, headers=headers)
              start = time.monotonic()
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
                      if body:
                          result = {"type": payload.get("type"), "model": payload.get("model"),
                                    "stop_reason": payload.get("stop_reason")}
                      else:
                          result = {"models": sorted(m.get("id", "") for m in payload.get("data", [])),
                                    "object": payload.get("object"), "has_more": payload.get("has_more")}
                      print(json.dumps({"probe": label, "status": response.status, "result": result}))
              except urllib.error.HTTPError as error:
                  output = error.read().decode(errors="replace").replace(key, "[REDACTED]").replace(base, "[REDACTED]")
                  print(json.dumps({"probe": label, "status": error.code, "error": output[:6000]}))
              except Exception as error:
                  output = str(error).replace(key, "[REDACTED]").replace(base, "[REDACTED]")
                  print(json.dumps({"probe": label, "error_type": type(error).__name__, "error": output}))
              print(f"{label} duration: {time.monotonic() - start:.1f}s")

          probe("openai-model-list", normalized + "/v1/models", {"Authorization": "Bearer " + key})
          headers = {"x-api-key": key, "anthropic-version": "2023-06-01", "Content-Type": "application/json"}
          body = {"model": "claude-opus-5-5", "max_tokens": 16,
                  "messages": [{"role": "user", "content": "Reply OK."}]}
          probe("original-model", base + "/v1/messages", headers, body)
          if normalized != base:
              probe("normalized-endpoint", normalized + "/v1/messages", headers, body)
